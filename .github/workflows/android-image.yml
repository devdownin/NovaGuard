name: Android build image

# Its own workflow so it can be path-filtered: building the image downloads
# several gigabytes of Android SDK, which no ordinary pull request should pay
# for. GitHub only supports `paths` at workflow level, hence the separate file
# rather than a job inside ci.yml.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/android-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/android-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build the image and an APK with it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t novaguard-android:ci .

      # A successful `docker build` only proves the commands exited zero. These
      # assert the pinned components are actually on disk, so a silently
      # partial `sdkmanager --install` fails here rather than in a release
      # build weeks later.
      - name: Assert the pinned toolchain is present
        run: |
          docker run --rm novaguard-android:ci bash -euo pipefail -c '
            java -version
            node --version
            test -d "$ANDROID_HOME/platforms/android-36"
            test -d "$ANDROID_HOME/build-tools/36.0.0"
            test -d "$ANDROID_HOME/ndk/27.1.12297006"
            test -d "$ANDROID_HOME/cmake/3.30.5"
          '

      # The point of the image is that it can produce the APK, so that is what
      # is checked — not a proxy for it.
      - name: Build a release APK inside the image
        run: |
          docker run --rm \
            -v "$PWD":/app -w /app \
            novaguard-android:ci \
            bash -euo pipefail -c '
              npm ci --no-audit --no-fund
              cd android && ./gradlew assembleRelease --no-daemon
            '

      - name: Upload the APK it produced
        uses: actions/upload-artifact@v4
        with:
          name: novaguard-release-apk-docker
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
